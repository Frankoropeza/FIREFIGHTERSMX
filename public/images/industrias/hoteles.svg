<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Hotel con detección de incendio en habitaciones y señalización de evacuación">
  <defs>
    <linearGradient id="bghotele" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glhotele" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grhotele" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bghotele)"/>
  <rect width="640" height="720" fill="url(#grhotele)"/>
  <rect width="640" height="720" fill="url(#glhotele)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 101</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">NOM-003</text>
  </g>

  <g>
    <!-- torre hotel -->
    <rect x="190" y="140" width="260" height="400" rx="8" fill="#122133" stroke="#4A7599" stroke-width="3.5"/>
    <rect x="190" y="140" width="260" height="36" fill="#F5A623"/>
    <text x="320" y="165" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="19" fill="#0C1825" letter-spacing="5">HOTEL</text>
    <g fill="#F7E7A0" opacity="0.9">
      <rect x="216" y="200" width="44" height="36"/><rect x="298" y="200" width="44" height="36"/><rect x="380" y="200" width="44" height="36"/>
      <rect x="216" y="262" width="44" height="36"/><rect x="380" y="262" width="44" height="36"/>
      <rect x="216" y="324" width="44" height="36"/><rect x="298" y="324" width="44" height="36"/><rect x="380" y="324" width="44" height="36"/>
      <rect x="298" y="386" width="44" height="36"/><rect x="380" y="386" width="44" height="36"/>
    </g>
    <!-- habitación con detector activo -->
    <rect x="298" y="262" width="44" height="36" fill="#0A1420" stroke="#F75000" stroke-width="3"/>
    <circle cx="320" cy="280" r="8" fill="#F75000"/>
    <path d="M306 252c8-8 20-8 28 0M300 244c11-11 29-11 40 0" stroke="#F75000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- entrada -->
    <rect x="286" y="468" width="68" height="72" fill="#0A1420" stroke="#2C4A63" stroke-width="2.5"/>
    <!-- señal de evacuación -->
    <g transform="translate(140 460)">
      <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#34D399"/>
      <circle cx="-22" cy="-10" r="7" fill="#040A12"/>
      <path d="M-22 0l0 16M-22 2l12 10M-22 2l-10 12M-4 -2h28M16 -12l12 10-12 10" stroke="#040A12" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- panel recepción -->
    <g transform="translate(520 470)">
      <rect x="-58" y="-50" width="116" height="100" rx="8" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
      <rect x="-42" y="-34" width="84" height="26" rx="4" fill="#0A1420"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="13" fill="#F75000">HAB. 304</text>
      <circle cx="-26" cy="16" r="7" fill="#F75000"/><circle cx="0" cy="16" r="7" fill="#34D399"/><circle cx="26" cy="16" r="7" fill="#1A2E44" stroke="#4A7599" stroke-width="2"/>
    </g>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
