<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Estación de bomberos municipal con personal equipado NFPA">
  <defs>
    <linearGradient id="bgbomber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glbomber" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grbomber" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgbomber)"/>
  <rect width="640" height="720" fill="url(#grbomber)"/>
  <rect width="640" height="720" fill="url(#glbomber)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
