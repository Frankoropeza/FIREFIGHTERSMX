<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Hospital con sistema contra incendio y evacuación por compartimentos">
  <defs>
    <linearGradient id="bghospit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glhospit" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grhospit" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bghospit)"/>
  <rect width="640" height="720" fill="url(#grhospit)"/>
  <rect width="640" height="720" fill="url(#glhospit)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 101</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">COFEPRIS</text>
  </g>

  <g>
    <!-- edificio hospital -->
    <rect x="150" y="170" width="340" height="360" rx="8" fill="#122133" stroke="#4A7599" stroke-width="3.5"/>
    <g fill="#0A1420" stroke="#2C4A63" stroke-width="2.5">
      <rect x="180" y="210" width="60" height="48"/><rect x="290" y="210" width="60" height="48"/><rect x="400" y="210" width="60" height="48"/>
      <rect x="180" y="290" width="60" height="48"/><rect x="290" y="290" width="60" height="48"/><rect x="400" y="290" width="60" height="48"/>
      <rect x="180" y="370" width="60" height="48"/><rect x="400" y="370" width="60" height="48"/>
    </g>
    <!-- cruz -->
    <g transform="translate(320 396)"><circle r="40" fill="#34D399"/><rect x="-9" y="-24" width="18" height="48" fill="#040A12"/><rect x="-24" y="-9" width="48" height="18" fill="#040A12"/></g>
    <!-- entrada -->
    <rect x="280" y="458" width="80" height="72" fill="#0A1420" stroke="#2C4A63" stroke-width="2.5"/>
    <!-- rociador y detección en azotea -->
    <rect x="150" y="148" width="340" height="22" fill="#C43D00"/>
    <g stroke="#7AA4C4" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M210 148v-26M320 148v-26M430 148v-26"/>
    </g>
    <circle cx="210" cy="112" r="9" fill="#F75000"/><circle cx="320" cy="112" r="9" fill="#F75000"/><circle cx="430" cy="112" r="9" fill="#F75000"/>
    <!-- camilla evacuación -->
    <g transform="translate(180 600)">
      <rect x="-60" y="-22" width="180" height="14" rx="7" fill="#7AA4C4"/>
      <rect x="-44" y="-40" width="70" height="18" rx="9" fill="#E8F2F9"/>
      <circle cx="-40" cy="6" r="13" fill="#122133" stroke="#4A7599" stroke-width="2.5"/>
      <circle cx="96" cy="6" r="13" fill="#122133" stroke="#4A7599" stroke-width="2.5"/>
    </g>
    <!-- flecha evacuación -->
    <g transform="translate(470 596)">
      <rect x="-66" y="-26" width="132" height="52" rx="6" fill="#34D399"/>
      <path d="M-30 0h44M2 -14l16 14-16 14" stroke="#040A12" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
