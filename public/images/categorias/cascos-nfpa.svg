<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Casco para bombero certificado NFPA 1971 con visor integrado">
  <defs>
    <linearGradient id="bgGradC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/>
      <stop offset="0.6" stop-color="#070E1A"/>
      <stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B26"/>
      <stop offset="0.55" stop-color="#F75000"/>
      <stop offset="1" stop-color="#C43D00"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C4A63"/>
      <stop offset="1" stop-color="#0A1420"/>
    </linearGradient>
    <pattern id="gridC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="640" height="720" fill="url(#bgGradC)"/>
  <rect width="640" height="720" fill="url(#gridC)"/>
  <rect width="640" height="720" fill="url(#glowC)"/>

  <!-- Casco estructural -->
  <g>
    <!-- ala trasera/lateral -->
    <ellipse cx="320" cy="420" rx="218" ry="64" fill="#C43D00"/>
    <ellipse cx="320" cy="410" rx="218" ry="64" fill="url(#shellGrad)"/>
    <!-- copa -->
    <path d="M320 158c-92 0-160 74-164 178 0 28 18 50 46 54 36 6 82 10 118 10s82-4 118-10c28-4 46-26 46-54-4-104-72-178-164-178z" fill="url(#shellGrad)" stroke="#7C2D12" stroke-width="3"/>
    <!-- cresta superior -->
    <path d="M296 150c0-10 11-18 24-18s24 8 24 18l8 168c0 10-14 16-32 16s-32-6-32-16z" fill="#FFB186"/>
    <path d="M296 150c0-10 11-18 24-18s24 8 24 18l3 60h-54z" fill="#FF8F57"/>
    <!-- escudo frontal -->
    <g>
      <path d="M320 236l38 14v34c0 26-16 44-38 52-22-8-38-26-38-52v-34z" fill="#0A1420" stroke="#F5A623" stroke-width="3"/>
      <text x="320" y="282" text-anchor="middle" font-family="Rajdhani, Arial, sans-serif" font-weight="700" font-size="22" fill="#F5A623">FFMX</text>
      <text x="320" y="304" text-anchor="middle" font-family="Rajdhani, Arial, sans-serif" font-weight="700" font-size="12" fill="#FFE5D9" letter-spacing="1">BOMBEROS</text>
    </g>
    <!-- banda reflejante en copa -->
    <path d="M170 372c44 12 96 18 150 18s106-6 150-18" fill="none" stroke="#F5A623" stroke-width="14" stroke-linecap="round"/>
    <path d="M170 392c44 12 96 16 150 16s106-4 150-16" fill="none" stroke="#E8F2F9" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <!-- visor abatible -->
    <path d="M196 446c34 26 78 40 124 40s90-14 124-40l-16 84c-26 22-66 36-108 36s-82-14-108-36z" fill="url(#visorGrad)" opacity="0.92" stroke="#4A7599" stroke-width="2.5"/>
    <path d="M226 470c28 16 60 24 94 24s66-8 94-24" fill="none" stroke="#7AA4C4" stroke-width="2" opacity="0.5"/>
    <!-- tornillos laterales -->
    <circle cx="186" cy="442" r="12" fill="#122133" stroke="#4A7599" stroke-width="2.5"/>
    <circle cx="454" cy="442" r="12" fill="#122133" stroke="#4A7599" stroke-width="2.5"/>
    <!-- barbiquejo -->
    <path d="M210 480c20 70 60 112 110 112s90-42 110-112" fill="none" stroke="#2C4A63" stroke-width="9" stroke-linecap="round"/>
    <rect x="300" y="580" width="40" height="18" rx="4" fill="#122133" stroke="#4A7599" stroke-width="2"/>
  </g>

  <!-- Etiquetas técnicas -->
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <g>
      <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
      <text x="114" y="71" text-anchor="middle" font-size="17" fill="#FF8F57" letter-spacing="2">NFPA 1971:2018</text>
    </g>
    <g>
      <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
      <text x="526" y="71" text-anchor="middle" font-size="17" fill="#7AA4C4" letter-spacing="2">1.35 KG</text>
    </g>
    <!-- líneas de spec -->
    <g stroke="#4A7599" stroke-width="1.5" opacity="0.8">
      <path d="M468 380h72"/><circle cx="468" cy="380" r="3.5" fill="#F5A623" stroke="none"/>
      <path d="M452 508h88"/><circle cx="452" cy="508" r="3.5" fill="#F75000" stroke="none"/>
      <path d="M172 300h-64"/><circle cx="172" cy="300" r="3.5" fill="#FF6B26" stroke="none"/>
    </g>
    <text x="546" y="374" font-size="13" fill="#7AA4C4" letter-spacing="1">TRIM</text>
    <text x="546" y="386" font-size="13" fill="#7AA4C4" letter-spacing="1">REFLEJANTE</text>
    <text x="546" y="502" font-size="13" fill="#7AA4C4" letter-spacing="1">VISOR</text>
    <text x="546" y="514" font-size="13" fill="#7AA4C4" letter-spacing="1">ABATIBLE</text>
    <text x="104" y="294" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">FIBRA DE</text>
    <text x="104" y="306" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">VIDRIO HT</text>
  </g>

  <!-- Base -->
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
