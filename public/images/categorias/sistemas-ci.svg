<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Sistema contra incendio: rociador automático y panel de detección NFPA">
  <defs>
    <linearGradient id="bgsistem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glsistem" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grsistem" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgsistem)"/>
  <rect width="640" height="720" fill="url(#grsistem)"/>
  <rect width="640" height="720" fill="url(#glsistem)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="114" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 13 · 72</text>
    <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="526" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">FM-200</text>
  </g>

  <g>
    <!-- tubería superior -->
    <rect x="80" y="140" width="480" height="26" rx="6" fill="#C43D00" stroke="#7C2D12" stroke-width="3"/>
    <rect x="296" y="166" width="48" height="34" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <!-- rociador -->
    <path d="M308 200h24v34h-24z" fill="#F5A623" stroke="#92600A" stroke-width="2.5"/>
    <path d="M300 234h40l-8 22h-24z" fill="#E8F2F9" stroke="#4A7599" stroke-width="2.5"/>
    <circle cx="320" cy="276" r="9" fill="#FF6B26"/>
    <!-- abanico de agua -->
    <g stroke="#7AA4C4" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
      <path d="M320 290c0 36 0 70 0 96"/><path d="M300 290c-22 32-38 64-48 92"/>
      <path d="M340 290c22 32 38 64 48 92"/><path d="M282 288c-40 24-66 52-84 76"/>
      <path d="M358 288c40 24 66 52 84 76"/>
    </g>
    <!-- panel FACP -->
    <rect x="200" y="430" width="240" height="170" rx="10" fill="#122133" stroke="#4A7599" stroke-width="3"/>
    <rect x="222" y="452" width="196" height="44" rx="5" fill="#0A1420" stroke="#2C4A63" stroke-width="2"/>
    <text x="320" y="480" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="19" fill="#34D399" letter-spacing="3">SISTEMA NORMAL</text>
    <g>
      <circle cx="246" cy="530" r="9" fill="#34D399"/><circle cx="286" cy="530" r="9" fill="#1A2E44" stroke="#4A7599" stroke-width="2"/>
      <circle cx="326" cy="530" r="9" fill="#1A2E44" stroke="#4A7599" stroke-width="2"/><circle cx="366" cy="530" r="9" fill="#F75000"/>
    </g>
    <rect x="228" y="556" width="80" height="26" rx="4" fill="#1A2E44" stroke="#4A7599" stroke-width="2"/>
    <rect x="332" y="556" width="80" height="26" rx="4" fill="#1A2E44" stroke="#4A7599" stroke-width="2"/>
    <!-- estrobo -->
    <rect x="488" y="430" width="64" height="86" rx="8" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <circle cx="520" cy="462" r="17" fill="#F75000"/>
    <text x="520" y="502" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="12" fill="#94A3B8">FIRE</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M344 222h96" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="344" cy="222" r="3.5" fill="#F5A623"/>
    <text x="448" y="218" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">ROCIADOR</text>
    <text x="448" y="231" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">K-FACTOR</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M440 515h60" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="440" cy="515" r="3.5" fill="#34D399"/>
    <text x="508" y="511" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">TABLERO</text>
    <text x="508" y="524" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">FACP</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M196 580h-84" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="196" cy="580" r="3.5" fill="#F75000"/>
    <text x="104" y="576" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">NOTIFIC.</text>
    <text x="104" y="589" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">AUDIBLE</text>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
