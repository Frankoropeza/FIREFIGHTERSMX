<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Herramienta hidráulica de rescate certificada NFPA 1936">
  <defs>
    <linearGradient id="bgherram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glherram" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grherram" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgherram)"/>
  <rect width="640" height="720" fill="url(#grherram)"/>
  <rect width="640" height="720" fill="url(#glherram)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="114" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 1936</text>
    <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="526" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">1,060 kN</text>
  </g>

  <!-- Separador hidráulico -->
  <g transform="rotate(-18 320 380)">
    <!-- brazos -->
    <path d="M320 180l-96 150c-8 12-4 28 8 34l26 12 70-120z" fill="#F75000" stroke="#7C2D12" stroke-width="3"/>
    <path d="M320 180l96 150c8 12 4 28-8 34l-26 12-70-120z" fill="#FF6B26" stroke="#7C2D12" stroke-width="3"/>
    <!-- puntas -->
    <path d="M224 330l-44 60 22 18 48-44z" fill="#E8F2F9" stroke="#4A7599" stroke-width="2.5"/>
    <path d="M416 330l44 60-22 18-48-44z" fill="#E8F2F9" stroke="#4A7599" stroke-width="2.5"/>
    <!-- cuerpo central -->
    <rect x="284" y="256" width="72" height="140" rx="12" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <rect x="296" y="396" width="48" height="120" rx="10" fill="#122133" stroke="#4A7599" stroke-width="3"/>
    <!-- empuñadura giratoria -->
    <circle cx="320" cy="470" r="38" fill="#0A1420" stroke="#F5A623" stroke-width="5"/>
    <path d="M320 440v60M290 470h60" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
    <!-- mango trasero -->
    <rect x="286" y="516" width="68" height="64" rx="14" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M430 280h80" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="430" cy="280" r="3.5" fill="#FF6B26"/>
    <text x="518" y="276" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">BRAZOS</text>
    <text x="518" y="289" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">FORJADOS</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M430 470h84" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="430" cy="470" r="3.5" fill="#F5A623"/>
    <text x="522" y="466" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">CONTROL</text>
    <text x="522" y="479" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">360°</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M196 560h-76" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="196" cy="560" r="3.5" fill="#F75000"/>
    <text x="112" y="556" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">BATERÍA</text>
    <text x="112" y="569" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">PENTHEON</text>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
