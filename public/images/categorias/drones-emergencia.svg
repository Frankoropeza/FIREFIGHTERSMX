<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Dron con cámara térmica para emergencias y búsqueda y rescate">
  <defs>
    <linearGradient id="bgdrones" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="gldrones" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grdrones" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgdrones)"/>
  <rect width="640" height="720" fill="url(#grdrones)"/>
  <rect width="640" height="720" fill="url(#gldrones)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="114" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">AFAC</text>
    <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="526" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">TÉRMICA RAD.</text>
  </g>

  <g>
    <!-- brazos -->
    <g stroke="#2C4A63" stroke-width="13" stroke-linecap="round">
      <path d="M260 312L170 232"/><path d="M380 312l90-80"/><path d="M260 388l-90 80"/><path d="M380 388l90 80"/>
    </g>
    <!-- motores + hélices -->
    <g>
      <circle cx="162" cy="224" r="22" fill="#122133" stroke="#4A7599" stroke-width="3"/>
      <ellipse cx="162" cy="224" rx="86" ry="10" fill="#7AA4C4" opacity="0.3"/>
      <circle cx="478" cy="224" r="22" fill="#122133" stroke="#4A7599" stroke-width="3"/>
      <ellipse cx="478" cy="224" rx="86" ry="10" fill="#7AA4C4" opacity="0.3"/>
      <circle cx="162" cy="476" r="22" fill="#122133" stroke="#4A7599" stroke-width="3"/>
      <ellipse cx="162" cy="476" rx="86" ry="10" fill="#7AA4C4" opacity="0.3"/>
      <circle cx="478" cy="476" r="22" fill="#122133" stroke="#4A7599" stroke-width="3"/>
      <ellipse cx="478" cy="476" rx="86" ry="10" fill="#7AA4C4" opacity="0.3"/>
    </g>
    <!-- cuerpo -->
    <rect x="252" y="296" width="136" height="108" rx="24" fill="#1A2E44" stroke="#4A7599" stroke-width="3.5"/>
    <rect x="252" y="296" width="136" height="30" rx="15" fill="#F75000"/>
    <circle cx="320" cy="352" r="13" fill="#34D399"/>
    <!-- gimbal con cámara térmica -->
    <path d="M320 404v26" stroke="#4A7599" stroke-width="7"/>
    <rect x="284" y="430" width="72" height="58" rx="12" fill="#122133" stroke="#F5A623" stroke-width="3.5"/>
    <circle cx="320" cy="459" r="18" fill="#0A1420" stroke="#F5A623" stroke-width="3.5"/>
    <circle cx="314" cy="453" r="5" fill="#7AA4C4" opacity="0.7"/>
    <!-- haz de búsqueda -->
    <path d="M302 492L240 612h160l-62-120z" fill="#F75000" opacity="0.14"/>
    <!-- persona detectada -->
    <g transform="translate(320 596)">
      <circle cx="0" cy="-14" r="9" fill="#F5A623"/>
      <path d="M0 -5c-9 0-15 7-15 16v14h30v-14c0-9-6-16-15-16z" fill="#F5A623"/>
    </g>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M388 340h112" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="388" cy="340" r="3.5" fill="#34D399"/>
    <text x="508" y="336" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">GPS RTK</text>
    <text x="508" y="349" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">TELEMETRÍA</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M356 459h144" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="356" cy="459" r="3.5" fill="#F5A623"/>
    <text x="508" y="455" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">GIMBAL</text>
    <text x="508" y="468" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">TÉRMICO</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M240 600h-128" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="240" cy="600" r="3.5" fill="#F75000"/>
    <text x="104" y="596" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">DETECCIÓN</text>
    <text x="104" y="609" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">DE PERSONAS</text>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
