<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Traje HAZMAT Nivel A encapsulado certificado NFPA 1991">
  <defs>
    <linearGradient id="bghazmat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glhazmat" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grhazmat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bghazmat)"/>
  <rect width="640" height="720" fill="url(#grhazmat)"/>
  <rect width="640" height="720" fill="url(#glhazmat)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="114" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 1991</text>
    <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="526" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">NIVEL A</text>
  </g>

  <g>
    <!-- traje encapsulado -->
    <path d="M320 130c-78 0-128 56-132 132l-12 250c-2 36 22 66 58 70 28 4 58 6 86 6s58-2 86-6c36-4 60-34 58-70l-12-250c-4-76-54-132-132-132z" fill="#F5A623" stroke="#92600A" stroke-width="4"/>
    <!-- visor -->
    <path d="M320 170c-44 0-74 30-76 72 0 30 18 54 40 62h72c22-8 40-32 40-62-2-42-32-72-76-72z" fill="#0A1420" stroke="#2C4A63" stroke-width="4"/>
    <path d="M268 220c8-26 28-42 52-42" fill="none" stroke="#7AA4C4" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <!-- cierre diagonal -->
    <path d="M252 330l136 130" stroke="#92600A" stroke-width="11" stroke-linecap="round"/>
    <path d="M252 330l136 130" stroke="#FDE68A" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/>
    <!-- pliegues -->
    <path d="M210 420c30 14 76 22 110 22M214 510c30 14 72 20 106 20" fill="none" stroke="#C28413" stroke-width="4" opacity="0.6"/>
    <!-- guantes -->
    <path d="M186 470c-26 6-40 28-38 54 2 22 20 38 42 36 20-2 34-18 34-38l-4-44z" fill="#C43D00" stroke="#7C2D12" stroke-width="3.5"/>
    <path d="M454 470c26 6 40 28 38 54-2 22-20 38-42 36-20-2-34-18-34-38l4-44z" fill="#C43D00" stroke="#7C2D12" stroke-width="3.5"/>
    <!-- SCBA interno marcado -->
    <rect x="288" y="338" width="64" height="96" rx="14" fill="none" stroke="#92600A" stroke-width="3.5" stroke-dasharray="9 7"/>
    <!-- rombo -->
    <g transform="translate(320 560) rotate(45)">
      <rect x="-26" y="-26" width="52" height="52" fill="#0A1420" stroke="#F75000" stroke-width="3.5"/>
    </g>
    <text x="320" y="567" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="17" fill="#FF8F57">A</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M396 220h104" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="396" cy="220" r="3.5" fill="#F5A623"/>
    <text x="508" y="216" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">VISOR</text>
    <text x="508" y="229" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">ANTIEMPAÑO</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M352 386h148" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="352" cy="386" r="3.5" fill="#FF6B26"/>
    <text x="508" y="382" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">SCBA</text>
    <text x="508" y="395" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">INTERNO</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M186 500h-74" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="186" cy="500" r="3.5" fill="#F75000"/>
    <text x="104" y="496" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">GUANTE</text>
    <text x="104" y="509" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">QUÍMICO</text>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
