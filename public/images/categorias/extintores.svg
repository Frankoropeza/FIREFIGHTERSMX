<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Extintor certificado NOM-154-SCFI y NFPA 10">
  <defs>
    <linearGradient id="bgextint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glextint" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grextint" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgextint)"/>
  <rect width="640" height="720" fill="url(#grextint)"/>
  <rect width="640" height="720" fill="url(#glextint)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="148" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="114" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NOM-154-SCFI</text>
    <rect x="452" y="48" width="148" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="526" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">NFPA 10</text>
  </g>

  <g>
    <!-- cuerpo -->
    <rect x="244" y="220" width="152" height="350" rx="58" fill="#F75000" stroke="#7C2D12" stroke-width="3"/>
    <rect x="244" y="330" width="152" height="76" fill="#C43D00"/>
    <!-- etiqueta -->
    <rect x="270" y="346" width="100" height="120" rx="6" fill="#E8F2F9"/>
    <text x="320" y="386" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="34" fill="#C43D00">ABC</text>
    <text x="320" y="412" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="15" fill="#122133">PQS 6 KG</text>
    <text x="320" y="438" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="12" fill="#64748B">NOM-154-SCFI</text>
    <!-- válvula y maneral -->
    <rect x="300" y="170" width="40" height="56" rx="8" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <path d="M276 168h120l-14 26h-92z" fill="#122133" stroke="#4A7599" stroke-width="3"/>
    <circle cx="278" cy="206" r="10" fill="#F5A623" stroke="#92600A" stroke-width="2.5"/>
    <!-- manómetro -->
    <circle cx="372" cy="196" r="20" fill="#122133" stroke="#34D399" stroke-width="3.5"/>
    <path d="M372 196l10-11" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <!-- manguera -->
    <path d="M252 240c-56 16-72 110-56 220 10 70 38 104 68 110" fill="none" stroke="#0A1420" stroke-width="14" stroke-linecap="round"/>
    <path d="M264 570l-26 30 20 16 30-28z" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <!-- collar de garantía -->
    <ellipse cx="320" cy="238" rx="76" ry="14" fill="none" stroke="#F5A623" stroke-width="5"/>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M396 240h96" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="396" cy="240" r="3.5" fill="#F5A623"/>
    <text x="500" y="236" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">COLLAR DE</text>
    <text x="500" y="249" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">GARANTÍA</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M392 196h100" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="392" cy="196" r="3.5" fill="#34D399"/>
    <text x="500" y="192" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">PRESIÓN</text>
    <text x="500" y="205" text-anchor="start" font-size="13" fill="#7AA4C4" letter-spacing="1">OK</text>
  </g>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <path d="M196 460h-84" stroke="#4A7599" stroke-width="1.5" opacity="0.8"/>
    <circle cx="196" cy="460" r="3.5" fill="#F75000"/>
    <text x="104" y="456" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">RECARGA</text>
    <text x="104" y="469" text-anchor="end" font-size="13" fill="#7AA4C4" letter-spacing="1">ANUAL</text>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
