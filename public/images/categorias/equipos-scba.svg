      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glequipo" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.22"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grequipo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgequipo)"/>
