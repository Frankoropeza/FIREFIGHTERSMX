<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Instalación de sistema contra incendio con rociador, tubería y herramientas">
  <defs>
    <linearGradient id="bginstal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glinstal" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grinstal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bginstal)"/>
  <rect width="640" height="720" fill="url(#grinstal)"/>
  <rect width="640" height="720" fill="url(#glinstal)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NFPA 13 · 72</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">LLAVE EN MANO</text>
  </g>

  <g>
    <!-- tubería -->
    <rect x="60" y="170" width="520" height="30" rx="8" fill="#C43D00" stroke="#7C2D12" stroke-width="3"/>
    <rect x="170" y="160" width="24" height="50" rx="5" fill="#7C2D12"/>
    <rect x="446" y="160" width="24" height="50" rx="5" fill="#7C2D12"/>
    <!-- rociador -->
    <rect x="304" y="200" width="32" height="42" fill="#F5A623" stroke="#92600A" stroke-width="3"/>
    <path d="M294 242h52l-10 26h-32z" fill="#E8F2F9" stroke="#4A7599" stroke-width="2.5"/>
    <circle cx="320" cy="286" r="10" fill="#FF6B26"/>
    <g stroke="#7AA4C4" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
      <path d="M320 302v84"/><path d="M298 300c-22 28-36 56-44 82"/><path d="M342 300c22 28 36 56 44 82"/>
    </g>
    <!-- planos -->
    <g transform="translate(206 520) rotate(-4)">
      <rect x="-110" y="-72" width="220" height="150" rx="8" fill="#E8F2F9"/>
      <g stroke="#4A7599" stroke-width="2.5" fill="none">
        <rect x="-86" y="-48" width="80" height="60"/><rect x="14" y="-48" width="58" height="34"/>
        <path d="M-86 42h158M-46 12v30M34 0v42"/>
      </g>
      <circle cx="54" cy="44" r="22" fill="none" stroke="#F75000" stroke-width="3"/>
    </g>
    <!-- nivel/herramienta -->
    <g transform="translate(450 540) rotate(10)">
      <rect x="-90" y="-18" width="180" height="36" rx="8" fill="#F5A623" stroke="#92600A" stroke-width="3"/>
      <rect x="-26" y="-10" width="52" height="20" rx="6" fill="#0A1420"/>
      <circle cx="0" cy="0" r="6" fill="#34D399"/>
    </g>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
