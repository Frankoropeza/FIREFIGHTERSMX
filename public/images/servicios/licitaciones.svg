<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Expediente técnico de licitación con sello de cumplimiento y documentos CompraNet">
  <defs>
    <linearGradient id="bglicita" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="gllicita" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grlicita" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bglicita)"/>
  <rect width="640" height="720" fill="url(#grlicita)"/>
  <rect width="640" height="720" fill="url(#gllicita)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">COMPRANET</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">PEMEX · CFE</text>
  </g>

  <g>
    <!-- folder trasero -->
    <g transform="translate(296 380) rotate(-6)">
      <rect x="-150" y="-180" width="300" height="400" rx="10" fill="#122133" stroke="#4A7599" stroke-width="3"/>
    </g>
    <!-- documento principal -->
    <g transform="translate(330 386) rotate(3)">
      <rect x="-150" y="-190" width="300" height="410" rx="10" fill="#E8F2F9"/>
      <rect x="-118" y="-150" width="236" height="14" rx="7" fill="#475569"/>
      <rect x="-118" y="-118" width="180" height="11" rx="5" fill="#94A3B8"/>
      <g fill="#CBD5E1">
        <rect x="-118" y="-86" width="236" height="9" rx="4"/><rect x="-118" y="-64" width="236" height="9" rx="4"/>
        <rect x="-118" y="-42" width="190" height="9" rx="4"/><rect x="-118" y="-12" width="236" height="9" rx="4"/>
        <rect x="-118" y="10" width="160" height="9" rx="4"/>
      </g>
      <!-- tabla de partidas -->
      <g stroke="#94A3B8" stroke-width="2" fill="none">
        <rect x="-118" y="44" width="236" height="84"/>
        <path d="M-118 72h236M-118 100h236M-40 44v84M40 44v84"/>
      </g>
      <!-- sello -->
      <g transform="translate(64 162) rotate(-14)">
        <circle r="52" fill="none" stroke="#F75000" stroke-width="5"/>
        <circle r="40" fill="none" stroke="#F75000" stroke-width="2"/>
        <text y="-6" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="15" fill="#F75000">CUMPLE</text>
        <text y="14" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="11" fill="#F75000">NFPA · NOM</text>
      </g>
    </g>
    <!-- clip -->
    <path d="M196 178c0-22 30-22 30 0v110c0 38-54 38-54 0v-92" fill="none" stroke="#F5A623" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
</svg>
