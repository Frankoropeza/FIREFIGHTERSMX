<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Auditoría de cumplimiento NOM-002 con lista de verificación y semáforo">
  <defs>
    <linearGradient id="bgaudito" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glaudito" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="graudito" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgaudito)"/>
  <rect width="640" height="720" fill="url(#graudito)"/>
  <rect width="640" height="720" fill="url(#glaudito)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NOM-002-STPS</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">INFORME EJEC.</text>
  </g>

  <g>
    <!-- clipboard -->
    <rect x="170" y="150" width="300" height="420" rx="14" fill="#122133" stroke="#4A7599" stroke-width="3.5"/>
    <rect x="190" y="176" width="260" height="370" rx="8" fill="#E8F2F9"/>
    <rect x="272" y="132" width="96" height="40" rx="10" fill="#1A2E44" stroke="#4A7599" stroke-width="3"/>
    <!-- checklist -->
    <g font-family="Rajdhani, Arial" font-weight="700">
      <rect x="212" y="210" width="26" height="26" rx="5" fill="#34D399"/>
      <path d="M218 223l6 7 10-12" stroke="#0A1420" stroke-width="3" fill="none"/>
      <rect x="252" y="216" width="170" height="12" rx="6" fill="#94A3B8"/>
      <rect x="212" y="258" width="26" height="26" rx="5" fill="#34D399"/>
      <path d="M218 271l6 7 10-12" stroke="#0A1420" stroke-width="3" fill="none"/>
      <rect x="252" y="264" width="140" height="12" rx="6" fill="#CBD5E1"/>
      <rect x="212" y="306" width="26" height="26" rx="5" fill="#F5A623"/>
      <text x="225" y="326" text-anchor="middle" font-size="19" fill="#0A1420">!</text>
      <rect x="252" y="312" width="158" height="12" rx="6" fill="#CBD5E1"/>
      <rect x="212" y="354" width="26" height="26" rx="5" fill="#F75000"/>
      <path d="M219 361l12 12M231 361l-12 12" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="252" y="360" width="120" height="12" rx="6" fill="#CBD5E1"/>
    </g>
    <!-- semáforo de cumplimiento -->
    <rect x="212" y="412" width="216" height="56" rx="8" fill="#0A1420"/>
    <rect x="222" y="424" width="92" height="32" fill="#34D399"/>
    <rect x="314" y="424" width="62" height="32" fill="#F5A623"/>
    <rect x="376" y="424" width="42" height="32" fill="#F75000"/>
    <text x="320" y="506" text-anchor="middle" font-family="Rajdhani, Arial" font-weight="700" font-size="17" fill="#64748B" letter-spacing="2">CUMPLIMIENTO 72%</text>
    <!-- lupa -->
    <g transform="translate(452 480)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#F75000" stroke-width="9"/>
      <path d="M38 38l52 52" stroke="#F75000" stroke-width="13" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="52" fill="rgba(247,80,0,0.08)"/>
