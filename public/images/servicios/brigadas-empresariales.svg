<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="Brigada contra incendio empresarial formada con jefe de brigada y equipo asignado">
  <defs>
    <linearGradient id="bgbrigad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1825"/><stop offset="0.6" stop-color="#070E1A"/><stop offset="1" stop-color="#040A12"/>
    </linearGradient>
    <radialGradient id="glbrigad" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#F75000" stop-opacity="0.2"/><stop offset="1" stop-color="#F75000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grbrigad" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7AA4C4" stroke-width="0.6" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="720" fill="url(#bgbrigad)"/>
  <rect width="640" height="720" fill="url(#grbrigad)"/>
  <rect width="640" height="720" fill="url(#glbrigad)"/>
  <g font-family="Rajdhani, Arial, sans-serif" font-weight="700">
    <rect x="40" y="48" width="158" height="34" fill="rgba(247,80,0,0.12)" stroke="rgba(247,80,0,0.4)"/>
    <text x="119" y="71" text-anchor="middle" font-size="16" fill="#FF8F57" letter-spacing="2">NOM-002</text>
    <rect x="442" y="48" width="158" height="34" fill="rgba(74,117,153,0.12)" stroke="rgba(74,117,153,0.4)"/>
    <text x="521" y="71" text-anchor="middle" font-size="16" fill="#7AA4C4" letter-spacing="2">DC-3 INCLUIDO</text>
  </g>

  <g>
    <!-- jefe de brigada (centro, grande) -->
    <g transform="translate(320 360)">
      <circle cx="0" cy="-58" r="34" fill="#F5A623"/>
      <path d="M-34-70a34 34 0 0 1 68 0z" fill="#F75000"/>
      <rect x="-42" y="-76" width="84" height="9" rx="4" fill="#C43D00"/>
      <path d="M0-16c-40 0-66 28-66 68v86h132v-86c0-40-26-68-66-68z" fill="#F75000"/>
      <rect x="-66" y="36" width="132" height="18" fill="#F5A623"/>
      <rect x="-66" y="58" width="132" height="7" fill="#E8F2F9" opacity="0.85"/>
    </g>
    <!-- brigadistas flanqueando -->
    <g transform="translate(170 420)" opacity="0.92">
      <circle cx="0" cy="-44" r="26" fill="#7AA4C4"/>
      <path d="M0-12c-30 0-50 22-50 52v66h100v-66c0-30-20-52-50-52z" fill="#1A2E44" stroke="#4A7599" stroke-width="2.5"/>
      <rect x="-50" y="28" width="100" height="13" fill="#F5A623"/>
    </g>
    <g transform="translate(470 420)" opacity="0.92">
      <circle cx="0" cy="-44" r="26" fill="#7AA4C4"/>
      <path d="M0-12c-30 0-50 22-50 52v66h100v-66c0-30-20-52-50-52z" fill="#1A2E44" stroke="#4A7599" stroke-width="2.5"/>
      <rect x="-50" y="28" width="100" height="13" fill="#F5A623"/>
    </g>
    <!-- escudo -->
    <g transform="translate(320 170)">
      <path d="M0-44l52 18v34c0 34-22 58-52 70-30-12-52-36-52-70v-34z" fill="#0A1420" stroke="#F75000" stroke-width="4"/>
      <path d="M0-8c0 0-13 10-8 22 3 6 8 6 8 6s-3-6 0-11c3-5 8-5 8-5s-3 8 2 13c2 2 3 5 3 5s5-4 5-11c0-8-9-13-9-13s2 5 0 8c0 0-4-9-9-14z" fill="#F75000"/>
    </g>
  </g>
  <rect x="0" y="688" width="640" height="32" fill="#0A1420"/>
  <rect x="0" y="686" width="640" height="2" fill="#F75000" opacity="0.5"/>
